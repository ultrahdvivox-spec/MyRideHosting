<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>My Ride Admin</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:14px;font-family:Arial,sans-serif;
 background:#f1f5f9;color:#172033
}
.container{max-width:750px;margin:auto}
h1{color:#111827}
.card{
 background:white;padding:17px;border-radius:13px;
 margin:12px 0;box-shadow:0 2px 9px #0001
}
input,select,button{
 width:100%;padding:12px;margin:7px 0;
 border-radius:8px;font-size:15px
}
input,select{border:1px solid #cbd5e1}
button{
 border:0;background:#111827;color:white;
 font-weight:bold;cursor:pointer
}
button:disabled{opacity:.5}
.green{background:#15803d}
.red{background:#dc2626}
.blue{background:#1d4ed8}
.gray{background:#475569}
.item{
 background:#fff;padding:14px;border:1px solid #ddd;
 border-radius:10px;margin:12px 0;
 overflow-wrap:anywhere;line-height:1.6
}
.status{
 padding:8px;background:#f1f5f9;
 border-radius:7px;margin:8px 0
}
.hidden{display:none!important}
.small{font-size:13px;color:#64748b}
#message,#panelMessage{white-space:pre-wrap}
</style>
</head>
<body>
<div class="container">

<h1>🚗 My Ride Admin</h1>
<p>Admin Control Panel</p>

<div class="card" id="loginBox">
<h3>Admin Login</h3>
<input id="email" type="email" placeholder="Admin Email">
<input id="password" type="password" placeholder="Password">
<button id="loginBtn">Login करें</button>
<p id="message"></p>
</div>

<div id="panel" class="hidden">

<div class="card">
<h3>👨‍💼 Admin Dashboard</h3>
<p id="adminEmail"></p>
<button class="blue" id="refreshBtn">सभी डेटा Refresh करें</button>
<button class="gray" id="logoutBtn">Logout</button>
<p id="panelMessage"></p>
</div>

<div class="card">
<h3>👤 Driver Verification</h3>
<p class="small">Driver Profile देखकर ही Verify और Activate करें।</p>
<div id="drivers">Drivers लोड हो रहे हैं...</div>
</div>

<div class="card">
<h3>🚕 सभी Bookings</h3>
<p id="bookingCount"></p>
<div id="bookings">Bookings लोड हो रही हैं...</div>
</div>

</div>
</div>

<script type="module">
import {initializeApp}
from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";

import {
getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

import {
getFirestore,collection,getDocs,doc,updateDoc,
serverTimestamp,runTransaction
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyDKWUV2Qx_Jm7R_NVlLNcdUKLAWyZn3P6s",
authDomain:"myridebhilwara-45652.firebaseapp.com",
projectId:"myridebhilwara-45652",
storageBucket:"myridebhilwara-45652.firebasestorage.app",
messagingSenderId:"819961031572",
appId:"1:819961031572:web:b7e1f401c90d7335203d81"
};

const ADMIN_UID="cT4sWJpjCKf6KL7oT4UnbliYDgp2";

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const $=id=>document.getElementById(id);

let admin=null;
let driversCache=[];

function msg(text){
$("panelMessage").textContent=text;
}

function addText(parent,text,tag="p"){
const el=document.createElement(tag);
el.textContent=text;
parent.appendChild(el);
return el;
}

// LOGIN

$("loginBtn").onclick=async()=>{
const email=$("email").value.trim();
const password=$("password").value;

if(!email||!password){
$("message").textContent="Email और Password भरें।";
return;
}

$("loginBtn").disabled=true;
$("message").textContent="Login हो रहा है...";

try{
const result=await signInWithEmailAndPassword(auth,email,password);

if(result.user.uid!==ADMIN_UID){
await signOut(auth);
throw new Error("यह अकाउंट Admin नहीं है।");
}

$("message").textContent="";
}catch(e){
$("message").textContent="Login Error: "+e.message;
}finally{
$("loginBtn").disabled=false;
}
};

// AUTH

onAuthStateChanged(auth,async user=>{
if(user && user.uid===ADMIN_UID){
admin=user;
$("loginBox").classList.add("hidden");
$("panel").classList.remove("hidden");
$("adminEmail").textContent=user.email||"Admin";
await refreshAll();
}else{
admin=null;
$("loginBox").classList.remove("hidden");
$("panel").classList.add("hidden");
}
});

// REFRESH

$("refreshBtn").onclick=refreshAll;

async function refreshAll(){
if(!admin)return;
msg("डेटा लोड हो रहा है...");
await Promise.all([
loadDrivers(),
loadBookings()
]);
}

async function loadDrivers(){
$("drivers").replaceChildren();
$("drivers").textContent="Drivers लोड हो रहे हैं...";

try{
const snap=await getDocs(collection(db,"Drivers"));
driversCache=[];

snap.forEach(s=>{
driversCache.push({id:s.id,data:s.data()});
});

$("drivers").replaceChildren();

if(snap.empty){
addText($("drivers"),"अभी कोई Driver Profile नहीं है।");
return;
}

driversCache.forEach(({id,data})=>{
const item=document.createElement("div");
item.className="item";

addText(item,"Driver: "+(data.name||"नाम नहीं दिया"),"b");
addText(item,"UID: "+id);
addText(item,"Email: "+(data.email||"—"));
addText(item,"Mobile: "+(data.phone||"—"));
addText(item,"Vehicle: "+(data.vehicleNumber||"—"));
addText(item,"Model: "+(data.vehicleModel||"—"));
addText(item,"License: "+(data.licenseNumber||"—"));

const verified=data.verified===true;
const active=data.active===true;

const status=document.createElement("div");
status.className="status";
status.textContent=
"Verification: "+(verified?"Verified":"Pending")+
"\nActivation: "+(active?"Active":"Inactive");
item.appendChild(status);

const verifyBtn=document.createElement("button");
verifyBtn.className="blue";
verifyBtn.textContent=verified?"Verification हटाएँ":"Verify Driver";

verifyBtn.onclick=()=>setVerification(id,!verified,verifyBtn);

const activeBtn=document.createElement("button");
activeBtn.className=active?"red":"green";
activeBtn.textContent=active?"Deactivate Driver":"Activate Driver";

activeBtn.onclick=()=>setActivation(id,!active,activeBtn);

item.append(verifyBtn,activeBtn);
$("drivers").appendChild(item);
});

}catch(e){
$("drivers").textContent="Driver Error: "+e.message;
}
}

// VERIFY DRIVER

async function setVerification(uid,value,btn){
if(!admin)return;

if(value && !confirm("क्या इस Driver की Profile जाँचकर Verify करना चाहते हैं?"))return;

btn.disabled=true;
try{
const changes={
verified:value,
updatedAt:serverTimestamp()
};

if(!value)changes.active=false;

await updateDoc(doc(db,"Drivers",uid),changes);
msg("Driver Verification अपडेट हो गई।");
await loadDrivers();
}catch(e){
msg("Verification Error: "+e.code+" - "+e.message);
btn.disabled=false;
}
}

// ACTIVATE DRIVER

async function setActivation(uid,value,btn){
if(!admin)return;

const driver=driversCache.find(x=>x.id===uid);

if(value && driver?.data.verified!==true){
alert("पहले Driver को Verify करें।");
return;
}

if(value && !confirm("क्या Driver को Active करना चाहते हैं?"))return;

btn.disabled=true;
try{
await updateDoc(doc(db,"Drivers",uid),{
active:value,
updatedAt:serverTimestamp()
});

msg("Driver Activation अपडेट हो गई।");
await loadDrivers();
}catch(e){
msg("Activation Error: "+e.code+" - "+e.message);
btn.disabled=false;
}
}

// BOOKINGS

async function loadBookings(){
$("bookings").replaceChildren();
$("bookings").textContent="Bookings लोड हो रही हैं...";

try{
const snap=await getDocs(collection(db,"Booking"));
$("bookingCount").textContent="कुल बुकिंग: "+snap.size;
$("bookings").replaceChildren();

if(snap.empty){
addText($("bookings"),"अभी कोई Booking नहीं है।");
return;
}

snap.forEach(s=>{
const d=s.data();
const id=s.id;

const item=document.createElement("div");
item.className="item";

addText(item,"Booking ID: "+id,"b");
addText(item,"शुरुआत: "+(d.pickup||"खाली"));
addText(item,"मंजिल: "+(d.destination||"खाली"));
addText(item,"वाहन: "+(d.vehicleType||"—"));
addText(item,"Customer: "+(d.customerName||"—"));
addText(item,"Mobile: "+(d.customerPhone||"—"));
addText(item,"किराया: ₹"+(d.fare??"—"));

const status=document.createElement("div");
status.className="status";
status.textContent="Status: "+(d.status||"Pending");
item.appendChild(status);

if(!d.pickup||!d.destination){
addText(item,"⚠️ Pickup या Destination खाली है। यह Booking Assign नहीं करें।");
}

if(d.driverUid){
addText(item,"Assigned Driver: "+(d.driverName||d.driverUid));
addText(item,"Driver Mobile: "+(d.driverPhone||"—"));
}else if(d.status!=="Rejected"&&d.status!=="Completed"){
addText(item,"⚠️ अभी Driver Assign नहीं हुआ है।");
}

const canAssign=
d.status==="Pending" ||
(d.status==="Accepted"&&!d.driverUid);

if(canAssign && d.pickup && d.destination){
const eligible=driversCache.filter(x=>
x.data.verified===true &&
x.data.active===true &&
x.data.name && x.data.phone &&
x.data.vehicleNumber && x.data.vehicleModel
);

const select=document.createElement("select");
const first=document.createElement("option");
first.value="";
first.textContent="Driver चुनें";
select.appendChild(first);

eligible.forEach(driver=>{
const option=document.createElement("option");
option.value=driver.id;
option.textContent=
driver.data.name+" | "+driver.data.vehicleNumber;
select.appendChild(option);
});

const assign=document.createElement("button");
assign.className="green";
assign.textContent="Driver Assign + Accept Booking";

assign.onclick=async()=>{
if(!select.value){
alert("पहले Driver चुनें।");
return;
}
assign.disabled=true;
try{
await assignBooking(id,select.value);
}catch(e){
console.error(e);
}finally{
assign.disabled=false;
}
};

item.append(select,assign);
}

if(d.status==="Pending"&&!d.driverUid){
const reject=document.createElement("button");
reject.className="red";
reject.textContent="Reject Booking";
reject.onclick=async()=>{
if(!confirm("क्या यह Booking Reject करनी है?"))return;
reject.disabled=true;
try{
await updateDoc(doc(db,"Booking",id),{
status:"Rejected",
rejectedAt:serverTimestamp()
});
msg("Booking Reject हो गई।");
await loadBookings();
}catch(e){
msg("Reject Error: "+e.message);
reject.disabled=false;
}
};
item.appendChild(reject);
}

$("bookings").appendChild(item);
});

}catch(e){
$("bookings").textContent="Booking Error: "+e.code+" - "+e.message;
}
}

// ASSIGN DRIVER + ACCEPT

async function assignBooking(bookingId,driverUid){
if(!admin)return;

try{
await runTransaction(db,async transaction=>{
const bookingRef=doc(db,"Booking",bookingId);
const driverRef=doc(db,"Drivers",driverUid);

const bookingSnap=await transaction.get(bookingRef);
const driverSnap=await transaction.get(driverRef);

if(!bookingSnap.exists())throw new Error("Booking नहीं मिली।");
if(!driverSnap.exists())throw new Error("Driver नहीं मिला।");

const b=bookingSnap.data();
const d=driverSnap.data();

if(!["Pending","Accepted"].includes(b.status) ||
(b.status==="Accepted"&&b.driverUid)){
throw new Error("Booking पहले ही Assign या Update हो चुकी है।");
}

if(b.driverUid)throw new Error("Booking पर Driver पहले से Assign है।");

if(!b.pickup||!b.destination)
throw new Error("Pickup और Destination खाली हैं।");

if(d.verified!==true||d.active!==true)
throw new Error("Driver Verified और Active नहीं है।");

if(!d.name||!d.phone||!d.vehicleNumber||!d.vehicleModel)
throw new Error("Driver Profile अधूरी है।");

transaction.update(bookingRef,{
status:"Accepted",
driverUid:driverUid,
driverEmail:d.email||"",
driverName:d.name,
driverPhone:d.phone,
vehicleNumber:d.vehicleNumber,
vehicleModel:d.vehicleModel,
acceptedAt:serverTimestamp()
});
});

msg("✅ Driver Assign और Booking Accept हो गई।");
await refreshAll();

}catch(e){
msg("Assign Error: "+e.code+" - "+e.message);
}
}

// LOGOUT

$("logoutBtn").onclick=async()=>{
try{
await signOut(auth);
$("email").value="";
$("password").value="";
$("message").textContent="Logout हो गया।";
}catch(e){
msg("Logout Error: "+e.message);
}
};

</script>
</body>
</html>
