
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Ride Customer</title>

<style>
*{box-sizing:border-box}
body{
  font-family:Arial,sans-serif;
  background:#eef2ff;
  margin:0;
  padding:14px;
  color:#172033;
}
.container{max-width:650px;margin:auto}
.card{
  background:white;
  padding:18px;
  border-radius:12px;
  margin:12px 0;
  box-shadow:0 2px 8px #00000012;
}
h2,h3{margin-top:5px}
input,select,button{
  width:100%;
  padding:13px;
  margin:7px 0;
  border-radius:7px;
  border:1px solid #cbd5e1;
  font-size:15px;
}
button{
  background:#1d4ed8;
  color:white;
  border:0;
  font-weight:bold;
  cursor:pointer;
}
button:disabled{opacity:.6}
.secondary{background:#475569}
.cancel{background:#dc2626}
.booking{
  border:1px solid #dbeafe;
  padding:13px;
  border-radius:9px;
  margin:12px 0;
  overflow-wrap:anywhere;
}
.status{
  font-weight:bold;
  color:#166534;
}
.message{white-space:pre-wrap;color:#b91c1c}
.small{font-size:13px;color:#64748b}
</style>
</head>

<body>
<div class="container">

<h2>🚕 My Ride Customer</h2>

<div class="card" id="authBox">
  <h3>Customer Login / Register</h3>

  <input id="email" type="email" placeholder="Email Address">
  <input id="password" type="password" placeholder="Password (कम से कम 6 अक्षर)">

  <button id="loginBtn">Login</button>
  <button id="registerBtn" class="secondary">New Customer Register</button>

  <p id="authMessage" class="message"></p>
</div>

<div id="customerPanel" style="display:none">

  <div class="card">
    <h3 id="welcome">Welcome Customer</h3>
    <button id="logoutBtn" class="secondary">Logout</button>
  </div>

  <div class="card">
    <h3>🚕 New Ride Booking</h3>

    <input id="phone" type="tel" placeholder="Mobile Number">

    <input id="pickup" type="text" placeholder="Pickup Location">

    <input id="destination" type="text" placeholder="Destination">

    <select id="vehicleType">
      <option value="bike">Bike</option>
      <option value="auto">Auto</option>
      <option value="car">Car</option>
    </select>

    <button id="bookBtn">Book My Ride</button>

    <p id="bookingMessage" class="message"></p>
    <p class="small">अभी इस सिस्टम में Booking Fare ₹0 रखा गया है।</p>
  </div>

  <div class="card">
    <h3>📋 My Bookings</h3>
    <div id="myBookings">Loading...</div>
  </div>

</div>
</div>

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from
"https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  query,
  where,
  onSnapshot,
  updateDoc,
  doc,
  serverTimestamp
} from
"https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";


/* FIREBASE CONFIG */

const firebaseConfig = {
  apiKey: "AIzaSyDKWUV2Qx_Jm7R_NVlLNcdUKLAWyZn3P6s",
  authDomain: "myridebhilwara-45652.firebaseapp.com",
  projectId: "myridebhilwara-45652",
  storageBucket: "myridebhilwara-45652.firebasestorage.app",
  messagingSenderId: "819961031572",
  appId: "1:819961031572:web:b7e1f401c90d7335203d81",
  measurementId: "G-WTYS5RWL4V"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);

let stopBookings = null;


/* LOGIN */

$("loginBtn").onclick = async () => {
  try {
    $("authMessage").textContent = "Login हो रहा है...";

    await signInWithEmailAndPassword(
      auth,
      $("email").value.trim(),
      $("password").value
    );

    $("authMessage").textContent = "";

  } catch(error) {
    $("authMessage").textContent =
      "Login Error: " + error.message;
  }
};


/* REGISTER */

$("registerBtn").onclick = async () => {
  try {
    $("authMessage").textContent = "Account बनाया जा रहा है...";

    const email = $("email").value.trim();
    const password = $("password").value;

    if(!email || !password) {
      throw new Error("Email और Password भरें।");
    }

    if(password.length < 6) {
      throw new Error("Password कम से कम 6 अक्षर का होना चाहिए।");
    }

    await createUserWithEmailAndPassword(
      auth,
      email,
      password
    );

    $("authMessage").textContent = "";

  } catch(error) {
    $("authMessage").textContent =
      "Register Error: " + error.message;
  }
};


/* LOGOUT */

$("logoutBtn").onclick = async () => {
  try {
    await signOut(auth);
  } catch(error) {
    alert(error.message);
  }
};


/* AUTH STATE */

onAuthStateChanged(auth, user => {

  if(stopBookings) {
    stopBookings();
    stopBookings = null;
  }

  if(!user) {
    $("authBox").style.display = "block";
    $("customerPanel").style.display = "none";
    return;
  }

  $("authBox").style.display = "none";
  $("customerPanel").style.display = "block";

  $("welcome").textContent =
    "Welcome " + (user.email || "Customer");

  loadBookings(user);
});


/* CREATE BOOKING */

$("bookBtn").onclick = async () => {

  const user = auth.currentUser;

  if(!user) {
    alert("पहले Login करें।");
    return;
  }

  const phone = $("phone").value.trim();
  const pickup = $("pickup").value.trim();
  const destination = $("destination").value.trim();
  const vehicleType = $("vehicleType").value;

  if(!phone || !pickup || !destination) {
    $("bookingMessage").textContent =
      "कृपया Mobile Number, Pickup और Destination भरें।";
    return;
  }

  if(!/^[0-9]{10}$/.test(phone)) {
    $("bookingMessage").textContent =
      "कृपया सही 10 अंकों का Mobile Number डालें।";
    return;
  }

  try {

    $("bookBtn").disabled = true;
    $("bookingMessage").textContent = "Booking भेजी जा रही है...";

    await addDoc(collection(db,"Booking"), {

      customerUid: user.uid,
      customerEmail: user.email || "",
      customerPhone: phone,

      city: "Bhilwara",
      pickup: pickup,
      destination: destination,
      vehicleType: vehicleType,

      status: "Pending",
      fare: 0,

      driverUid: "",
      driverEmail: "",
      driverName: "",
      driverPhone: "",
      vehicleNumber: "",
      vehicleModel: "",

      driverLat: null,
      driverLng: null,

      createdAt: serverTimestamp()

    });

    $("pickup").value = "";
    $("destination").value = "";

    $("bookingMessage").textContent =
      "Booking सफलतापूर्वक भेज दी गई!";

  } catch(error) {

    $("bookingMessage").textContent =
      "Booking Error: " + error.message;

  } finally {
    $("bookBtn").disabled = false;
  }
};


/* LOAD CUSTOMER BOOKINGS */

function loadBookings(user) {

  const q = query(
    collection(db,"Booking"),
    where("customerUid","==",user.uid)
  );

  stopBookings = onSnapshot(q, snapshot => {

    $("myBookings").innerHTML = "";

    if(snapshot.empty) {
      $("myBookings").textContent =
        "अभी आपकी कोई Booking नहीं है।";
      return;
    }

    snapshot.forEach(snap => {

      const b = snap.data();

      const div = document.createElement("div");
      div.className = "booking";

      function addLine(label,value) {
        const p = document.createElement("p");
        const strong = document.createElement("b");
        strong.textContent = label + ": ";
        p.appendChild(strong);
        p.appendChild(document.createTextNode(value || "-"));
        div.appendChild(p);
      }

      addLine("Booking ID",snap.id);
      addLine("Pickup",b.pickup);
      addLine("Destination",b.destination);
      addLine("Vehicle",b.vehicleType);
      addLine("Status",b.status);
      addLine("Fare","₹" + (b.fare ?? 0));

      if(b.driverName) addLine("Driver Name",b.driverName);
      if(b.driverPhone) addLine("Driver Phone",b.driverPhone);
      if(b.vehicleNumber) addLine("Vehicle Number",b.vehicleNumber);
      if(b.vehicleModel) addLine("Vehicle Model",b.vehicleModel);

      if(b.status === "Pending") {

        const cancelBtn = document.createElement("button");
        cancelBtn.textContent = "Cancel Booking";
        cancelBtn.className = "cancel";

        cancelBtn.onclick = () =>
          cancelBooking(snap.id,cancelBtn);

        div.appendChild(cancelBtn);
      }

      $("myBookings").appendChild(div);

    });

  }, error => {

    $("myBookings").textContent =
      "Booking Error: " + error.message;

  });

}


/* CANCEL BOOKING */

async function cancelBooking(id,button) {

  if(!confirm("क्या आप यह Booking Cancel करना चाहते हैं?")) {
    return;
  }

  try {

    button.disabled = true;

    await updateDoc(
      doc(db,"Booking",id),
      { status: "Cancelled" }
    );

    alert("Booking Cancel हो गई।");

  } catch(error) {

    alert("Cancel Error: " + error.message);
    button.disabled = false;

  }

}

</script>
</body>
</html>
