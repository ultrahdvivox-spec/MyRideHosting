
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Ride Bhilwara - Customer</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;padding:14px;
 background:#eef2ff;
 color:#172033;
 font-family:Arial,sans-serif
}
.wrap{max-width:750px;margin:auto}
.card{
 background:white;padding:18px;
 border-radius:14px;margin:12px 0;
 box-shadow:0 3px 12px #00000010
}
h2{text-align:center;color:#1d4ed8}
input,select,button{
 width:100%;padding:13px;margin:7px 0;
 border:1px solid #ccc;border-radius:9px;
 font-size:16px
}
button{
 background:#1d4ed8;color:white;
 border:0;font-weight:bold;cursor:pointer
}
button:disabled{opacity:.6}
.secondary{background:#475569}
.danger{background:#b91c1c}
.item{
 border:1px solid #ddd;
 padding:13px;border-radius:10px;margin:12px 0
}
.status{
 background:#eff6ff;padding:10px;
 border-radius:8px;margin:8px 0
}
.small{font-size:13px;color:#64748b}
.hidden{display:none}
.message{font-weight:bold}
</style>
</head>

<body>
<main class="wrap">

<h2>🚕 My Ride Bhilwara</h2>
<p style="text-align:center">Customer Booking Panel</p>

<div class="card" id="authCard">
<h3>Customer Login / नया Account</h3>

<input id="email" type="email" placeholder="Email Address">
<input id="password" type="password" placeholder="Password">

<button id="loginBtn">Login करें</button>
<button id="signupBtn" class="secondary">
नया Account बनाएँ
</button>

<p id="authMsg" class="message"></p>
</div>

<div id="app" class="hidden">

<div class="card">
<b id="userLabel"></b>
<button id="logoutBtn" class="secondary">Logout</button>
</div>

<div class="card">
<h3>🚕 नई Ride Book करें</h3>

<input id="customerName" placeholder="आपका पूरा नाम">
<input id="phone" type="tel" maxlength="10"
placeholder="10 अंकों का मोबाइल नंबर">

<input id="pickup" placeholder="Pickup Location">
<input id="destination" placeholder="Destination">

<select id="vehicle">
<option value="bike">Bike</option>
<option value="auto">Auto</option>
<option value="car">Car</option>
</select>

<button id="bookBtn">बुकिंग करें</button>
<p id="bookMsg" class="message"></p>
</div>

<div class="card">
<h3>📋 मेरी Bookings</h3>
<button id="refreshBtn" class="secondary">Refresh</button>
<div id="bookings">लोड हो रहा है...</div>
</div>

</div>
</main>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
signOut
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
query,
where,
onSnapshot,
doc,
updateDoc,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

// YOUR FIREBASE CONFIG
const firebaseConfig = {
apiKey: "AIzaSyDKWUV2Qx_Jm7R_NVlLNcdUKLAWyZn3P6s",
authDomain: "myridebhilwara-45652.firebaseapp.com",
projectId: "myridebhilwara-45652",
storageBucket: "myridebhilwara-45652.firebasestorage.app",
messagingSenderId: "819961031572",
appId: "1:819961031572:web:b7e1f401c90d7335203d81",
measurementId: "G-WTYS5RWL4V"
};

const firebaseApp = initializeApp(firebaseConfig);
const auth = getAuth(firebaseApp);
const db = getFirestore(firebaseApp);

const $ = id => document.getElementById(id);

let currentUser = null;
let unsubscribe = null;

// LOGIN
$("loginBtn").onclick = async () => {
try {
$("authMsg").textContent = "Login हो रहा है...";

await signInWithEmailAndPassword(
auth,
$("email").value.trim(),
$("password").value
);

$("authMsg").textContent = "";

} catch(e) {
$("authMsg").textContent = e.message;
}
};

// SIGNUP
$("signupBtn").onclick = async () => {
try {
$("authMsg").textContent = "Account बन रहा है...";

await createUserWithEmailAndPassword(
auth,
$("email").value.trim(),
$("password").value
);

$("authMsg").textContent = "";

} catch(e) {
$("authMsg").textContent = e.message;
}
};

// LOGOUT
$("logoutBtn").onclick = async () => {
try {
await signOut(auth);
} catch(e) {
alert(e.message);
}
};

// AUTH STATE
onAuthStateChanged(auth,user=>{

currentUser = user;

$("authCard").classList.toggle("hidden",!!user);
$("app").classList.toggle("hidden",!user);

if(unsubscribe){
unsubscribe();
unsubscribe = null;
}

if(user){
$("userLabel").textContent =
"Customer: "+(user.email || user.uid);

watchBookings();
}

});

// CREATE BOOKING
$("bookBtn").onclick = async () => {

if(!currentUser){
$("bookMsg").textContent = "पहले Login करें";
return;
}

const name = $("customerName").value.trim();
const phone = $("phone").value.trim();
const pickup = $("pickup").value.trim();
const destination = $("destination").value.trim();
const vehicle = $("vehicle").value;

if(
!name ||
!/^\d{10}$/.test(phone) ||
!pickup ||
!destination
){
$("bookMsg").textContent =
"सभी जानकारी सही भरें।";
return;
}

const btn = $("bookBtn");
btn.disabled = true;

$("bookMsg").textContent = "Booking भेजी जा रही है...";

try {

await addDoc(collection(db,"Booking"),{

customerUid: currentUser.uid,
customerName: name,
customerEmail: currentUser.email || "",
customerPhone: phone,

city: "Bhilwara",
pickup: pickup,
destination: destination,
vehicleType: vehicle,

status: "Pending",
fare: 0,

driverUid: "",
driverEmail: "",
driverName: "",
driverPhone: "",
vehicleNumber: "",
vehicleModel: "",

driverLat: null,
driverLng: null,

createdAt: serverTimestamp()

});

$("bookMsg").textContent =
"✅ Booking सफलतापूर्वक भेज दी गई!";

$("pickup").value = "";
$("destination").value = "";

watchBookings();

} catch(e) {

console.error("Booking Error:",e);

$("bookMsg").textContent =
"Booking Error: "+e.code+" - "+e.message;

} finally {
btn.disabled = false;
}

};

// REFRESH
$("refreshBtn").onclick = () => {
watchBookings();
};

// WATCH BOOKINGS
function watchBookings(){

if(!currentUser) return;

if(unsubscribe){
unsubscribe();
unsubscribe = null;
}

const q = query(
collection(db,"Booking"),
where("customerUid","==",currentUser.uid)
);

unsubscribe = onSnapshot(q,snapshot=>{

const host = $("bookings");
host.innerHTML = "";

if(snapshot.empty){
host.textContent = "अभी कोई Booking नहीं है।";
return;
}

const rows = snapshot.docs.sort((a,b)=>
(b.data().createdAt?.seconds || 0) -
(a.data().createdAt?.seconds || 0)
);

rows.forEach(s=>{

const d = s.data();

const el = document.createElement("div");
el.className = "item";

const title = document.createElement("b");
title.textContent =
(d.pickup || "Pickup")+
" → "+
(d.destination || "Destination");

const info = document.createElement("div");
info.className = "status";
info.textContent =
"Status: "+(d.status || "Unknown")+
" | Vehicle: "+(d.vehicleType || "—")+
" | Fare: ₹"+(d.fare ?? 0);

const customer = document.createElement("p");
customer.className = "small";
customer.textContent =
"Customer: "+(d.customerName || "—")+
" | Mobile: "+(d.customerPhone || "—");

const driver = document.createElement("p");
driver.className = "small";

if(d.driverName){
driver.textContent =
"Driver: "+d.driverName+
" | Mobile: "+(d.driverPhone || "—")+
" | Vehicle: "+(d.vehicleNumber || "—");
}else{
driver.textContent = "Driver अभी assign नहीं हुआ";
}

el.append(title,info,customer,driver);

if(
["Accepted","Started"].includes(d.status) &&
d.driverPhone
){
const call = document.createElement("a");
call.href = "tel:"+d.driverPhone;
call.textContent = "📞 Driver को Call करें";
el.append(call);
}

if(d.status === "Pending"){

const cancel = document.createElement("button");
cancel.className = "danger";
cancel.textContent = "Booking Cancel करें";

cancel.onclick = async()=>{

if(!confirm("क्या आप Booking Cancel करना चाहते हैं?"))
return;

try{

await updateDoc(doc(db,"Booking",s.id),{
status:"Cancelled"
});

}catch(e){
alert("Cancel Error: "+e.code+" - "+e.message);
}

};

el.append(cancel);
}

host.append(el);

});

},error=>{

console.error("Booking Read Error:",error);

$("bookings").textContent =
"Read Error: "+error.code+" - "+error.message;

});

}

</script>
</body>
</html>
