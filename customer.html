
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Ride Customer</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#eef2ff;margin:0;padding:14px;color:#172033}
.container{max-width:650px;margin:auto}
.card{background:white;padding:18px;border-radius:14px;margin:12px 0;box-shadow:0 3px 12px #0001}
input,select,button{width:100%;padding:12px;margin:7px 0;border-radius:8px;border:1px solid #ccd3e0;font-size:15px}
button{background:#2457d6;color:white;border:0;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
.secondary{background:#475569}
.danger{background:#c62828}
.hidden{display:none}
.small{font-size:13px;color:#64748b;overflow-wrap:anywhere}
.booking{border:1px solid #e2e8f0;padding:13px;border-radius:10px;margin:10px 0}
.status{font-weight:bold;color:#2457d6}
</style>
</head>
<body>
<div class="container">
<h2>🚕 My Ride Customer</h2>

<div class="card" id="authBox">
<h3>Customer Login / Register</h3>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button id="loginBtn">Login</button>
<button id="registerBtn" class="secondary">New Customer Register</button>
<p id="authMsg" class="small"></p>
</div>

<div id="appBox" class="hidden">
<div class="card">
<b>Customer Login सफल हुआ!</b>
<p id="userInfo" class="small"></p>
<button id="logoutBtn" class="danger">Logout</button>
</div>

<div class="card">
<h3>📍 नई Ride Book करें</h3>
<input id="customerPhone" type="tel" placeholder="आपका Mobile Number">
<input id="pickup" placeholder="Pickup Location">
<input id="destination" placeholder="Destination">
<select id="vehicleType">
<option value="bike">Bike</option>
<option value="auto">Auto</option>
<option value="car">Car</option>
</select>
<button id="bookBtn">Confirm Booking</button>
<p id="bookMsg" class="small"></p>
</div>

<div class="card">
<h3>📋 मेरी Bookings</h3>
<button id="refreshBtn" class="secondary">Refresh Bookings</button>
<div id="bookingList">Loading...</div>
</div>
</div>
</div>

<script type="module">
import {initializeApp}
from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";

import {
 getAuth,createUserWithEmailAndPassword,
 signInWithEmailAndPassword,onAuthStateChanged,signOut
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

import {
 getFirestore,collection,addDoc,query,where,
 onSnapshot,serverTimestamp,doc,updateDoc
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

const firebaseConfig = {
 apiKey: "PASTE_YOUR_EXISTING_API_KEY",
 authDomain: "myridebhilwara-45652.firebaseapp.com",
 projectId: "myridebhilwara-45652",
 storageBucket: "myridebhilwara-45652.firebasestorage.app",
 messagingSenderId: "PASTE_YOUR_EXISTING_SENDER_ID",
 appId: "PASTE_YOUR_EXISTING_APP_ID"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const bookingRef=collection(db,"Booking");

let user=null;
let unsubscribeBookings=null;

const $=id=>document.getElementById(id);

function msg(id,text){
 $(id).textContent=text;
}

function esc(value){
 return String(value??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",
 '"':"&quot;","'":"&#39;"
 })[c]);
}

$("registerBtn").onclick=async()=>{
 try{
  const email=$("email").value.trim();
  const password=$("password").value;
  if(!email||password.length<6){
   msg("authMsg","Email और कम से कम 6 अक्षर का Password डालें।");
   return;
  }
  await createUserWithEmailAndPassword(auth,email,password);
 }catch(e){
  msg("authMsg",e.message);
 }
};

$("loginBtn").onclick=async()=>{
 try{
  await signInWithEmailAndPassword(
   auth,$("email").value.trim(),$("password").value
  );
 }catch(e){
  msg("authMsg",e.message);
 }
};

$("logoutBtn").onclick=()=>signOut(auth);
$("refreshBtn").onclick=()=>listenBookings();

onAuthStateChanged(auth,currentUser=>{
 user=currentUser;

 if(unsubscribeBookings){
  unsubscribeBookings();
  unsubscribeBookings=null;
 }

 if(user){
  $("authBox").classList.add("hidden");
  $("appBox").classList.remove("hidden");
  $("userInfo").textContent=
   "Email: "+(user.email||"")+" | UID: "+user.uid;
  listenBookings();
 }else{
  $("authBox").classList.remove("hidden");
  $("appBox").classList.add("hidden");
  $("bookingList").innerHTML="";
 }
});

$("bookBtn").onclick=async()=>{
 if(!user)return;

 const phone=$("customerPhone").value.trim();
 const pickup=$("pickup").value.trim();
 const destination=$("destination").value.trim();
 const vehicleType=$("vehicleType").value;

 if(!phone||!pickup||!destination){
  msg("bookMsg","Mobile, Pickup और Destination भरें।");
  return;
 }

 if(pickup.length>200||destination.length>200){
  msg("bookMsg","Location 200 अक्षरों से छोटी रखें।");
  return;
 }

 $("bookBtn").disabled=true;
 msg("bookMsg","Booking भेजी जा रही है...");

 try{
  const booking={
   customerUid:user.uid,
   customerEmail:user.email||"",
   customerPhone:phone,
   city:"Bhilwara",
   pickup,
   destination,
   vehicleType,
   status:"Pending",
   fare:0,
   driverUid:"",
   driverEmail:"",
   driverName:"",
   driverPhone:"",
   vehicleNumber:"",
   vehicleModel:"",
   driverLat:null,
   driverLng:null,
   createdAt:serverTimestamp()
  };

  const result=await addDoc(bookingRef,booking);
  msg("bookMsg","✅ Booking सफल! Booking ID: "+result.id);
  $("pickup").value="";
  $("destination").value="";
 }catch(e){
  msg("bookMsg","Booking Error: "+e.message);
 }finally{
  $("bookBtn").disabled=false;
 }
};

function listenBookings(){
 if(!user)return;

 if(unsubscribeBookings)unsubscribeBookings();

 msg("bookingList","Bookings लोड हो रही हैं...");

 const q=query(
  bookingRef,
  where("customerUid","==",user.uid)
 );

 unsubscribeBookings=onSnapshot(q,snapshot=>{
  $("bookingList").innerHTML="";

  if(snapshot.empty){
   $("bookingList").innerHTML="<p>अभी कोई Booking नहीं है।</p>";
   return;
  }

  const bookings=[];
  snapshot.forEach(d=>bookings.push({id:d.id,data:d.data()}));

  bookings.sort((a,b)=>{
   const ta=a.data.createdAt?.toMillis?.()||0;
   const tb=b.data.createdAt?.toMillis?.()||0;
   return tb-ta;
  });

  bookings.forEach(item=>{
   const b=item.data;
   const div=document.createElement("div");
   div.className="booking";

   div.innerHTML=`
    <b>Booking ID:</b> ${esc(item.id)}<br>
    <b>Pickup:</b> ${esc(b.pickup)}<br>
    <b>Destination:</b> ${esc(b.destination)}<br>
    <b>Vehicle:</b> ${esc(b.vehicleType)}<br>
    <b>Status:</b> <span class="status">${esc(b.status)}</span><br>
    <b>Driver:</b> ${esc(b.driverName||"अभी Assign नहीं हुआ")}<br>
    <b>Driver Mobile:</b> ${esc(b.driverPhone||"अभी उपलब्ध नहीं")}<br>
    <b>Vehicle Number:</b> ${esc(b.vehicleNumber||"अभी उपलब्ध नहीं")}<br>
    <b>Fare:</b> ₹${esc(b.fare??0)}
   `;

   if(b.status==="Pending"){
    const cancel=document.createElement("button");
    cancel.textContent="Cancel Booking";
    cancel.className="danger";
    cancel.onclick=()=>cancelBooking(item.id);
    div.appendChild(cancel);
   }

   if(b.driverLat!=null && b.driverLng!=null &&
      Number.isFinite(b.driverLat) && Number.isFinite(b.driverLng)){
    const map=document.createElement("a");
    map.href="https://www.openstreetmap.org/?mlat="+
      encodeURIComponent(b.driverLat)+"&mlon="+
      encodeURIComponent(b.driverLng)+"#map=17/"+
      encodeURIComponent(b.driverLat)+"/"+
      encodeURIComponent(b.driverLng);
    map.target="_blank";
    map.rel="noopener";
    map.textContent="📍 Driver Location देखें";
    map.style.display="block";
    map.style.marginTop="12px";
    div.appendChild(map);
   }

   $("bookingList").appendChild(div);
  });
 },error=>{
  msg("bookingList","Booking Error: "+error.message);
 });
}

async function cancelBooking(id){
 if(!confirm("क्या आप यह Booking Cancel करना चाहते हैं?"))return;

 try{
  await updateDoc(doc(db,"Booking",id),{
   status:"Cancelled"
  });
  alert("Booking Cancel हो गई।");
 }catch(e){
  alert("Cancel Error: "+e.message);
 }
}
</script>
</body>
</html>
