
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Ride Driver</title>
<style>
body{font-family:Arial;background:#eef2ff;margin:0;padding:20px}
.card{max-width:420px;margin:35px auto;background:white;padding:22px;border-radius:15px;box-shadow:0 3px 15px #0002}
h2{text-align:center;color:#0756b8}
input,button{width:100%;box-sizing:border-box;padding:14px;margin:10px 0;border-radius:8px;font-size:16px}
input{border:1px solid #ccc}
button{background:#0756b8;color:white;border:0}
#status{text-align:center;overflow-wrap:anywhere}
.hidden{display:none}
</style>
</head>
<body>
<div class="card">
<h2>🏍️ My Ride Driver</h2>
<h3>Email Login / Register</h3>
<div id="login">
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password (कम से कम 6 अक्षर)">
<button id="register">नया Account बनाएं</button>
<button id="signin">Login करें</button>
</div>
<div id="account" class="hidden">
<h3>Login सफल हुआ!</h3>
<p id="userEmail"></p>
<button id="logout">Logout</button>
</div>
<p id="status">Email और Password दर्ज करें।</p>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import {
 getAuth,createUserWithEmailAndPassword,
 signInWithEmailAndPassword,signOut,onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

const firebaseConfig={
 apiKey:"AIzaSyDKWUV2Qx_Jm7R_NVlLNcdUKLAWyZn3P6s",
 authDomain:"myridebhilwara-45652.firebaseapp.com",
 projectId:"myridebhilwara-45652",
 storageBucket:"myridebhilwara-45652.firebasestorage.app",
 messagingSenderId:"819961031572",
 appId:"1:819961031572:web:b7e1f401c90d7335203d81"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app); 
const status=document.getElementById("status");

function details(){
 return {
  email:document.getElementById("email").value.trim(),
  password:document.getElementById("password").value
 };
}

document.getElementById("register").onclick=async()=>{
 try{
  const {email,password}=details();
  if(!email||password.length<6){
   status.textContent="सही Email और कम से कम 6 अक्षर का Password डालें।";
   return;
  }
  await createUserWithEmailAndPassword(auth,email,password);
  status.textContent="Account बन गया!";
 }catch(e){status.textContent="Error: "+e.message;}
};

document.getElementById("signin").onclick=async()=>{
 try{
  const {email,password}=details();
  if(!email||!password){status.textContent="Email और Password डालें।";return;}
  await signInWithEmailAndPassword(auth,email,password);
  status.textContent="Login सफल!";
 }catch(e){status.textContent="Login Error: "+e.message;}
};

onAuthStateChanged(auth,user=>{
 document.getElementById("login").classList.toggle("hidden",!!user);
 document.getElementById("account").classList.toggle("hidden",!user);
 if(user)document.getElementById("userEmail").textContent="Email: "+user.email;
});

document.getElementById("logout").onclick=async()=>{
 try{await signOut(auth);status.textContent="Logout हो गया";}
 catch(e){status.textContent="Logout Error: "+e.message;}
};
 
const {getFirestore, collection, getDocs, doc, runTransaction} =
  await import("https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js");

const db = getFirestore(app);

const dashboard = document.createElement("div");
dashboard.innerHTML = `
  <hr>
  <h3>🚕 Available Pending Bookings</h3>
  <button id="loadBookings">Refresh Bookings</button>
  <div id="driverBookings"></div>
`;
document.getElementById("account").appendChild(dashboard);

async function loadDriverBookings() {
  const list = document.getElementById("driverBookings");
  list.textContent = "बुकिंग लोड हो रही हैं...";

  try {
    const snapshot = await getDocs(collection(db, "Booking"));
    list.replaceChildren();

    let count = 0;

    snapshot.forEach(b => {
      const data = b.data();
      if (data.status !== "Pending") return;

      count++;
      const card = document.createElement("div");
      card.style.cssText = "padding:14px;margin:12px 0;background:#eef2ff;border-radius:10px";

      const details = document.createElement("p");
      details.textContent =
        "शुरुआत: " + (data.pickup || "") +
        "\nमंजिल: " + (data.destination || "") +
        "\nवाहन: " + (data.vehicleType || "");

      const accept = document.createElement("button");
      accept.textContent = "Accept Booking";

      accept.onclick = async () => {
        accept.disabled = true;
        try {
          await runTransaction(db, async transaction => {
            const bookingRef = doc(db, "Booking", b.id);
            const latest = await transaction.get(bookingRef);

            if (!latest.exists() || latest.data().status !== "Pending") {
              throw new Error("यह बुकिंग किसी दूसरे Driver ने ले ली है।");
            }

            transaction.update(bookingRef, {
              status: "Accepted",
              driverUid: auth.currentUser.uid,
              driverEmail: auth.currentUser.email
            });
          });

          alert("Booking Accept हो गई!");
          await loadDriverBookings();
        } catch (error) {
          alert(error.message);
          accept.disabled = false;
        }
      };

      card.append(details, accept);
      list.appendChild(card);
    });

    if (count === 0) list.textContent = "अभी कोई Pending Booking नहीं है।";
  } catch (error) {
    list.textContent = "Error: " + error.message;
  }
}

document.getElementById("loadBookings").onclick = loadDriverBookings;
loadDriverBookings();

</script>
</body>
</html>
