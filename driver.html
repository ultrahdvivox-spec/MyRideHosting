
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Ride Driver</title>

<style>
*{box-sizing:border-box}
body{
 font-family:Arial,sans-serif;
 background:#eef2ff;
 margin:0;
 padding:16px;
 color:#172033;
}
.container{max-width:600px;margin:auto}
.card{
 background:white;
 padding:20px;
 border-radius:15px;
 margin:15px 0;
 box-shadow:0 3px 12px #0002;
}
h2{text-align:center;color:#0756b8}
input,button{
 width:100%;
 padding:14px;
 margin:9px 0;
 border-radius:9px;
 font-size:16px;
}
input{border:1px solid #ccc}
button{
 border:0;
 background:#0756b8;
 color:white;
 font-weight:bold;
}
button:disabled{opacity:.5}
.logout{background:#dc2626}
.accept{background:#15803d}
.booking{
 background:#f1f5f9;
 padding:14px;
 border-radius:12px;
 margin:12px 0;
 overflow-wrap:anywhere;
}
#status,#panelMessage{
 white-space:pre-wrap;
 overflow-wrap:anywhere;
}
.hidden{display:none}
</style>
</head>

<body>
<div class="container">

<div class="card">
<h2>🏍️ My Ride Driver</h2>

<div id="login">
<h3>Email Login / Register</h3>

<input id="email" type="email"
placeholder="अपना Email लिखें">

<input id="password" type="password"
placeholder="Password (कम से कम 6 अक्षर)">

<button id="register">नया Account बनाएं</button>
<button id="signin">Login करें</button>
</div>

<div id="account" class="hidden">
<h3>Login सफल हुआ!</h3>
<p id="userEmail"></p>
<button id="logout" class="logout">Logout</button>
</div>

<p id="status">Email और Password दर्ज करें।</p>
</div>

<div id="dashboard" class="hidden">

<div class="card">
<h3>🚕 Pending Bookings</h3>
<button id="refreshBtn">Refresh Bookings</button>
<p id="panelMessage">बुकिंग लोड हो रही हैं...</p>
<div id="pendingBookings"></div>
</div>

<div class="card">
<h3>✅ मेरी Accepted Bookings</h3>
<div id="myBookings"></div>
</div>

</div>
</div>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";

import {
 getAuth,
 createUserWithEmailAndPassword,
 signInWithEmailAndPassword,
 signOut,
 onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

import {
 getFirestore,
 collection,
 getDocs,
 doc,
 runTransaction
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyDKWUV2Qx_Jm7R_NVlLNcdUKLAWyZn3P6s",
 authDomain:"myridebhilwara-45652.firebaseapp.com",
 projectId:"myridebhilwara-45652",
 storageBucket:"myridebhilwara-45652.firebasestorage.app",
 messagingSenderId:"819961031572",
 appId:"1:819961031572:web:b7e1f401c90d7335203d81"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const status=document.getElementById("status");
const panelMessage=document.getElementById("panelMessage");
const pendingBookings=document.getElementById("pendingBookings");
const myBookings=document.getElementById("myBookings");

function getDetails(){
 return {
  email:document.getElementById("email").value.trim(),
  password:document.getElementById("password").value
 };
}

// नया Driver Account
document.getElementById("register").onclick=async()=>{
 try{
  const {email,password}=getDetails();

  if(!email||password.length<6){
   status.textContent=
   "सही Email और कम से कम 6 अक्षर का Password डालें।";
   return;
  }

  status.textContent="Account बनाया जा रहा है...";

  await createUserWithEmailAndPassword(auth,email,password);

  status.textContent="Account बन गया!";
 }catch(e){
  status.textContent="Error: "+e.message;
 }
};

// Driver Login
document.getElementById("signin").onclick=async()=>{
 try{
  const {email,password}=getDetails();

  if(!email||!password){
   status.textContent="Email और Password डालें।";
   return;
  }

  status.textContent="Login हो रहा है...";

  await signInWithEmailAndPassword(auth,email,password);

  status.textContent="Login सफल!";
 }catch(e){
  status.textContent="Login Error: "+e.message;
 }
};

// Booking Card
function createBookingCard(data,id,isMine){

 const card=document.createElement("div");
 card.className="booking";

 const details=document.createElement("p");

 details.textContent=
 "Booking ID: "+id+
 "\nशुरुआत: "+(data.pickup||"")+
 "\nमंजिल: "+(data.destination||"")+
 "\nवाहन: "+(data.vehicleType||"")+
 "\nस्टेटस: "+(data.status||"Pending");

 card.appendChild(details);

 if(!isMine){
  const accept=document.createElement("button");
  accept.className="accept";
  accept.textContent="Accept Booking";

  accept.onclick=async()=>{
   const user=auth.currentUser;

   if(!user){
    alert("पहले Login करें।");
    return;
   }

   accept.disabled=true;
   accept.textContent="Accept हो रहा है...";

   try{
    await runTransaction(db,async(transaction)=>{

     const bookingRef=doc(db,"Booking",id);
     const latest=await transaction.get(bookingRef);

     if(!latest.exists()){
      throw new Error("Booking उपलब्ध नहीं है।");
     }

     const latestData=latest.data();

     if(latestData.status!=="Pending"){
      throw new Error("यह Booking पहले ही Accept हो चुकी है।");
     }

     transaction.update(bookingRef,{
      status:"Accepted",
      driverUid:user.uid,
      driverEmail:user.email
     });
    });

    alert("Booking सफलतापूर्वक Accept हो गई!");
    await loadDriverBookings();

   }catch(e){
    alert("Booking Error: "+e.message);
    accept.disabled=false;
    accept.textContent="Accept Booking";
   }
  };

  card.appendChild(accept);
 }

 return card;
}

// Firebase Bookings लोड करना
async function loadDriverBookings(){

 const user=auth.currentUser;

 if(!user)return;

 pendingBookings.replaceChildren();
 myBookings.replaceChildren();

 panelMessage.textContent="बुकिंग लोड हो रही हैं...";

 try{
  const snapshot=await getDocs(collection(db,"Booking"));

  let pendingCount=0;
  let myCount=0;

  snapshot.forEach(bookingDoc=>{

   const data=bookingDoc.data();
   const id=bookingDoc.id;

   if(data.status==="Pending"){
    pendingCount++;
    pendingBookings.appendChild(
     createBookingCard(data,id,false)
    );
   }

   if(
    data.status==="Accepted" &&
    data.driverUid===user.uid
   ){
    myCount++;
    myBookings.appendChild(
     createBookingCard(data,id,true)
    );
   }
  });

  panelMessage.textContent=
   "कुल Pending Bookings: "+pendingCount;

  if(pendingCount===0){
   pendingBookings.textContent=
   "अभी कोई Pending Booking नहीं है।";
  }

  if(myCount===0){
   myBookings.textContent=
   "अभी आपकी कोई Accepted Booking नहीं है।";
  }

 }catch(e){

  panelMessage.textContent=
  "बुकिंग लोड नहीं हुई: "+e.message;

 }
}

// Login की स्थिति
onAuthStateChanged(auth,async(user)=>{

 const login=document.getElementById("login");
 const account=document.getElementById("account");
 const dashboard=document.getElementById("dashboard");

 login.classList.toggle("hidden",!!user);
 account.classList.toggle("hidden",!user);
 dashboard.classList.toggle("hidden",!user);

 if(user){
  document.getElementById("userEmail").textContent=
  "Driver Email: "+user.email;

  await loadDriverBookings();
 }
});

// Refresh
document.getElementById("refreshBtn").onclick=
loadDriverBookings;

// Logout
document.getElementById("logout").onclick=async()=>{
 try{
  await signOut(auth);
  status.textContent="Logout हो गया।";
 }catch(e){
  status.textContent="Logout Error: "+e.message;
 }
};

</script>
</body>
</html>
