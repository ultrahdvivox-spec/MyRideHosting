
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Ride Driver Panel</title>
<style>
body{font-family:Arial;background:#f1f5f9;margin:0;padding:15px}
.card{background:white;padding:18px;border-radius:12px;margin:12px 0}
input,button{width:100%;padding:12px;margin:7px 0;box-sizing:border-box}
button{background:#166534;color:white;border:0;border-radius:7px;font-weight:bold}
.booking{border:1px solid #ddd;padding:12px;margin:10px 0;border-radius:9px}
</style>
</head>
<body>
<h2>🚗 My Ride Driver Panel</h2>

<div class="card" id="loginBox">
<h3>Driver Login</h3>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button id="loginBtn">Login</button>
<p id="message"></p>
</div>

<div class="card" id="panel" style="display:none">
<h3 id="welcome">Driver Dashboard</h3>
<button id="logoutBtn">Logout</button>
<h3>Pending Bookings</h3>
<div id="pending">Loading...</div>
<h3>My Bookings</h3>
<div id="mine">Loading...</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import {
 getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
import {
 getFirestore, doc, getDoc, collection, query, where,
 onSnapshot, runTransaction, serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDKWUV2Qx_Jm7R_NVlLNcdUKLAWyZn3P6s",
  authDomain: "myridebhilwara-45652.firebaseapp.com",
  projectId: "myridebhilwara-45652",
  storageBucket: "myridebhilwara-45652.firebasestorage.app",
  messagingSenderId: "819961031572",
  appId: "1:819961031572:web:b7e1f401c90d7335203d81",
  measurementId: "G-WTYS5RWL4V"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);
let stopPending = null;
let stopMine = null;

$("loginBtn").onclick = async () => {
 try {
  $("message").textContent = "Login हो रहा है...";
  await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value);
 } catch(e) {
  $("message").textContent = "Login Error: " + e.message;
 }
};

$("logoutBtn").onclick = () => signOut(auth);

onAuthStateChanged(auth, async user => {
 if(stopPending) stopPending();
 if(stopMine) stopMine();

 if(!user){
  $("loginBox").style.display="block";
  $("panel").style.display="none";
  return;
 }

 try {
  const profile = await getDoc(doc(db,"Drivers",user.uid));
  if(!profile.exists()){
   $("message").textContent="पहले Driver Profile बनवाएँ। Admin से संपर्क करें।";
   await signOut(auth);
   return;
  }

  const d = profile.data();
  if(d.active !== true || d.verified !== true){
   $("message").textContent="आपका Driver Account अभी Active और Verified नहीं है।";
   await signOut(auth);
   return;
  }

  $("loginBox").style.display="none";
  $("panel").style.display="block";
  $("welcome").textContent="Welcome " + (d.name || "Driver");

  stopPending = onSnapshot(
   query(collection(db,"Booking"),where("status","==","Pending")),
   snap => {
    $("pending").innerHTML="";
    if(snap.empty){$("pending").textContent="अभी कोई Pending Booking नहीं है।";return;}
    snap.forEach(s=>{
     const b=s.data();
     const div=document.createElement("div");
     div.className="booking";
     div.innerHTML=`<b>Booking ID:</b> ${s.id}<br>
     <b>Pickup:</b> ${b.pickup || ""}<br>
     <b>Destination:</b> ${b.destination || ""}<br>
     <b>Vehicle:</b> ${b.vehicleType || ""}<br>
     <b>City:</b> ${b.city || ""}`;
     const btn=document.createElement("button");
     btn.textContent="Accept Booking";
     btn.onclick=()=>acceptBooking(s.id,user,d);
     div.appendChild(btn);
     $("pending").appendChild(div);
    });
   },
   e => $("pending").textContent="Error: "+e.message
  );

  stopMine = onSnapshot(
   query(collection(db,"Booking"),where("driverUid","==",user.uid)),
   snap => {
    $("mine").innerHTML="";
    if(snap.empty){$("mine").textContent="अभी आपकी कोई Booking नहीं है।";return;}
    snap.forEach(s=>{
     const b=s.data();
     const div=document.createElement("div");
     div.className="booking";
     div.innerHTML=`<b>Booking ID:</b> ${s.id}<br>
     <b>Pickup:</b> ${b.pickup || ""}<br>
     <b>Destination:</b> ${b.destination || ""}<br>
     <b>Status:</b> ${b.status || ""}`;
     if(b.status==="Accepted"){
      const btn=document.createElement("button");
      btn.textContent="Start Ride";
      btn.onclick=()=>changeStatus(s.id,"Started","rideStartedAt");
      div.appendChild(btn);
     }
     if(b.status==="Started"){
      const btn=document.createElement("button");
      btn.textContent="Complete Ride";
      btn.onclick=()=>changeStatus(s.id,"Completed","rideCompletedAt");
      div.appendChild(btn);
     }
     $("mine").appendChild(div);
    });
   },
   e => $("mine").textContent="Error: "+e.message
  );
 } catch(e) {
  $("message").textContent="Error: "+e.message;
 }
});

async function acceptBooking(id,user,d){
 try {
  await runTransaction(db,async tx=>{
   const ref=doc(db,"Booking",id);
   const snap=await tx.get(ref);
   if(!snap.exists() || snap.data().status!=="Pending" || snap.data().driverUid!==""){
    throw new Error("यह Booking अब उपलब्ध नहीं है।");
   }
   tx.update(ref,{
    status:"Accepted",
    driverUid:user.uid,
    driverEmail:user.email || "",
    driverName:d.name || "",
    driverPhone:d.phone || "",
    vehicleNumber:d.vehicleNumber || "",
    vehicleModel:d.vehicleModel || "",
    acceptedAt:serverTimestamp()
   });
  });
  alert("Booking Accepted!");
 } catch(e){alert(e.message);}
}

async function changeStatus(id,status,timeField){
 try{
  const ref=doc(db,"Booking",id);
  await runTransaction(db,async tx=>{
   const snap=await tx.get(ref);
   if(!snap.exists()) throw new Error("Booking नहीं मिली");
   tx.update(ref,{status,[timeField]:serverTimestamp()});
  });
 }catch(e){alert(e.message);}
}
</script>
</body>
</html>
