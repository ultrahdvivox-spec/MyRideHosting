

<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Ride Bhilwara Driver</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial;background:#eef2ff;color:#172033;margin:0;padding:14px}
.container{max-width:750px;margin:auto}
.card{background:white;padding:18px;border-radius:13px;margin:12px 0}
input,button{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:8px;font-size:15px}
button{background:#1d4ed8;color:white;border:0;font-weight:bold}
.secondary{background:#475569}
.green{background:#15803d}
.red{background:#b91c1c}
.item{border:1px solid #ddd;padding:13px;border-radius:10px;margin:12px 0;overflow-wrap:anywhere}
.hidden{display:none}
</style>
</head>
<body>
<div class="container">
<h2>🚘 My Ride Bhilwara — Driver</h2>

<div class="card" id="loginBox">
<h3>Driver Login</h3>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button id="loginBtn">Login</button>
<p id="message"></p>
</div>

<div id="panel" class="hidden">
<div class="card">
<b id="driverLabel"></b>
<button id="logoutBtn" class="secondary">Logout</button>
</div>

<div class="card" id="profileBox">
<h3>Driver Profile</h3>
<input id="name" placeholder="Driver Name">
<input id="phone" maxlength="10" placeholder="Mobile Number">
<input id="vehicleNumber" placeholder="Vehicle Number">
<input id="vehicleModel" placeholder="Vehicle Model">
<input id="licenseNumber" placeholder="Driving License Number">
<button id="saveProfile">Profile Save करें</button>
<p id="profileMsg"></p>
</div>

<div class="card">
<h3>Available Pending Bookings</h3>
<button id="refreshBtn" class="secondary">Refresh</button>
<div id="pending">लोड हो रहा है...</div>
</div>

<div class="card">
<h3>मेरी Accepted / Started Rides</h3>
<div id="active">लोड हो रहा है...</div>
</div>
</div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";

import {
getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

import {
getFirestore,collection,doc,getDoc,setDoc,
onSnapshot,runTransaction,serverTimestamp,query,where
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyDKWUV2Qx_Jm7R_NVlLNcdUKLAWyZn3P6s",
authDomain:"myridebhilwara-45652.firebaseapp.com",
projectId:"myridebhilwara-45652",
storageBucket:"myridebhilwara-45652.firebasestorage.app",
messagingSenderId:"819961031572",
appId:"1:819961031572:web:b7e1f401c90d7335203d81",
measurementId:"G-WTYS5RWL4V"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const $=id=>document.getElementById(id);

let user=null;
let profile=null;
let stopPending=null;
let stopActive=null;

$("loginBtn").onclick=async()=>{
try{
await signInWithEmailAndPassword(
auth,$("email").value.trim(),$("password").value
);
}catch(e){$("message").textContent=e.message;}
};

$("logoutBtn").onclick=()=>signOut(auth);

onAuthStateChanged(auth,async u=>{
user=u;

if(stopPending)stopPending();
if(stopActive)stopActive();

$("loginBox").classList.toggle("hidden",!!u);
$("panel").classList.toggle("hidden",!u);

if(!u)return;

$("driverLabel").textContent=u.email||u.uid;

try{
const snap=await getDoc(doc(db,"Drivers",u.uid));
profile=snap.exists()?snap.data():null;

if(profile){
$("name").value=profile.name||"";
$("phone").value=profile.phone||"";
$("vehicleNumber").value=profile.vehicleNumber||"";
$("vehicleModel").value=profile.vehicleModel||"";
$("licenseNumber").value=profile.licenseNumber||"";
}

if(profile?.verified===true&&profile?.active===true){
$("profileMsg").textContent="Verified और Active";
}else{
$("profileMsg").textContent="Profile भरें। Admin Verification के बाद Booking मिलेगी।";
}

watchBookings();
}catch(e){
$("profileMsg").textContent="Profile Error: "+e.message;
}
});

$("saveProfile").onclick=async()=>{
if(!user)return;

const data={
uid:user.uid,
name:$("name").value.trim(),
phone:$("phone").value.trim(),
vehicleNumber:$("vehicleNumber").value.trim(),
vehicleModel:$("vehicleModel").value.trim(),
licenseNumber:$("licenseNumber").value.trim(),
updatedAt:serverTimestamp()
};

if(!data.name||!/^\\d{10}$/.test(data.phone)||
!data.vehicleNumber||!data.vehicleModel||!data.licenseNumber){
$("profileMsg").textContent="सभी जानकारी सही भरें।";
return;
}

try{
await setDoc(doc(db,"Drivers",user.uid),{
...data,
verified:profile?.verified===true,
active:profile?.active===true
},{merge:true});

profile={...profile,...data};
$("profileMsg").textContent="Profile Save हो गई। Admin Verification का इंतजार करें।";
}catch(e){
$("profileMsg").textContent="Error: "+e.message;
}
};

function watchBookings(){
if(stopPending)stopPending();
if(stopActive)stopActive();

stopPending=onSnapshot(
query(collection(db,"Booking"),where("status","==","Pending")),
snapshot=>{
$("pending").innerHTML="";

if(!profile?.verified||!profile?.active){
$("pending").textContent="Admin Verification जरूरी है।";
return;
}

if(snapshot.empty){
$("pending").textContent="अभी कोई Pending Booking नहीं है।";
return;
}

snapshot.forEach(s=>{
const d=s.data();
const el=document.createElement("div");
el.className="item";

const info=document.createElement("p");
info.textContent=(d.pickup||"—")+" → "+(d.destination||"—")+
" | Vehicle: "+(d.vehicleType||"—")+
" | Customer: "+(d.customerName||d.customerPhone||"—");
el.append(info);

const btn=document.createElement("button");
btn.textContent="Accept Booking";
btn.onclick=()=>acceptBooking(s.id);
el.append(btn);
$("pending").append(el);
}
);
},
error=>{
$("pending").textContent="Error: "+error.message;
});

const q=query(
collection(db,"Booking"),
where("driverUid","==",user.uid)
);

stopActive=onSnapshot(q,snapshot=>{
$("active").innerHTML="";
const rows=snapshot.docs.filter(s=>
["Accepted","Started"].includes(s.data().status)
);

if(!rows.length){
$("active").textContent="आपके पास कोई Active Ride नहीं है।";
return;
}

rows.forEach(s=>{
const d=s.data();
const el=document.createElement("div");
el.className="item";

const info=document.createElement("p");
info.textContent=(d.pickup||"—")+" → "+(d.destination||"—")+
" | Customer: "+(d.customerName||d.customerPhone||"—")+
" | Mobile: "+(d.customerPhone||"—")+
" | Status: "+d.status;
el.append(info);

if(d.status==="Accepted"){
const start=document.createElement("button");
start.className="green";
start.textContent="Start Ride";
start.onclick=()=>changeRideStatus(s.id,"Started");
el.append(start);
}

if(d.status==="Started"){
const done=document.createElement("button");
done.className="green";
done.textContent="Complete Ride";
done.onclick=()=>changeRideStatus(s.id,"Completed");
el.append(done);
}

$("active").append(el);
});
},error=>{
$("active").textContent="Error: "+error.message;
});
}

async function acceptBooking(id){
if(!profile?.verified||!profile?.active){
alert("Driver Verified और Active होना चाहिए।");
return;
}

try{
await runTransaction(db,async transaction=>{
const bookingRef=doc(db,"Booking",id);
const driverRef=doc(db,"Drivers",user.uid);

const [bookingSnap,driverSnap]=await Promise.all([
transaction.get(bookingRef),
transaction.get(driverRef)
]);

if(!bookingSnap.exists()||!driverSnap.exists()){
throw new Error("Booking या Driver Profile नहीं मिली।");
}

const b=bookingSnap.data();
const d=driverSnap.data();

if(b.status!=="Pending"){
throw new Error("यह Booking पहले ही किसी ने ले ली है।");
}

if(d.verified!==true||d.active!==true){
throw new Error("Driver Verification नहीं है।");
}

transaction.update(bookingRef,{
status:"Accepted",
driverUid:user.uid,
driverEmail:user.email||"",
driverName:d.name,
driverPhone:d.phone,
vehicleNumber:d.vehicleNumber,
vehicleModel:d.vehicleModel,
acceptedAt:serverTimestamp()
});
});

alert("Booking सफलतापूर्वक Accept हो गई।");
}catch(e){
alert("Booking Error: "+e.message);
}
}

async function changeRideStatus(id,status){
try{
await runTransaction(db,async transaction=>{
const ref=doc(db,"Booking",id);
const snap=await transaction.get(ref);

if(!snap.exists())throw new Error("Booking नहीं मिली।");

const d=snap.data();

if(d.driverUid!==user.uid)throw new Error("यह आपकी Booking नहीं है।");

if(status==="Started"&&d.status!=="Accepted"){
throw new Error("Ride अभी Start नहीं हो सकती।");
}

if(status==="Completed"&&d.status!=="Started"){
throw new Error("Ride पहले Start करें।");
}

transaction.update(ref,{
status:status,
updatedAt:serverTimestamp()
});
});
}catch(e){
alert("Status Error: "+e.message);
}
}

$("refreshBtn").onclick=()=>location.reload();
</script>
</body>
</html>
