
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Ride - Book Your Ride</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  color: #172033;
}

header {
  background: #101c35;
  color: white;
  padding: 22px;
  border-radius: 0 0 22px 22px;
}

header h1 { margin: 0; font-size: 29px; }
header p { color: #cbd5e1; margin-bottom: 0; }

.container {
  max-width: 550px;
  margin: auto;
  padding: 16px;
}

.card {
  background: white;
  padding: 18px;
  border-radius: 18px;
  box-shadow: 0 4px 15px #0000000d;
}

label {
  display: block;
  margin: 15px 0 8px;
  font-weight: bold;
}

input, select {
  width: 100%;
  padding: 14px;
  border: 1px solid #cbd5e1;
  border-radius: 10px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 16px;
  border: none;
  border-radius: 11px;
  background: #ffbb00;
  color: #172033;
  font-size: 17px;
  font-weight: bold;
}

button:disabled { opacity: 0.6; }

#map {
  height: 320px;
  margin-top: 18px;
  border-radius: 14px;
  overflow: hidden;
}

#result {
  margin-top: 16px;
  padding: 15px;
  background: #eff6ff;
  border-radius: 12px;
  line-height: 1.9;
  overflow-wrap: anywhere;
}

.small {
  font-size: 12px;
  color: #64748b;
  line-height: 1.6;
  margin-top: 14px;
}
</style>
</head>

<body>

<header>
  <h1>🏍️ My Ride</h1>
  <p>आपकी यात्रा, आपका सफर!</p>
</header>

<div class="container">
  <div class="card">

    <h2>अपनी राइड बुक करें</h2>

    <label for="vehicleType">🚗 अपना वाहन चुनें</label>
    <select id="vehicleType">
      <option value="bike">Bike</option>
      <option value="car">Car</option>
      <option value="auto">Auto</option>
      <option value="e-rickshaw">E-Rickshaw</option>
    </select>

    <label for="pickup">📍 कहाँ से जाना है?</label>
    <input id="pickup" placeholder="Bhilwara, Rajasthan">

    <label for="drop">🏁 कहाँ जाना है?</label>
    <input id="drop" placeholder="Ajmer, Rajasthan">

    <button id="searchBtn" onclick="calculateRide()">
      🗺️ दूरी और किराया देखें
    </button>

    <div id="result">
      अपनी यात्रा की दोनों जगह दर्ज करें।
    </div>

    <div id="map"></div>

    <button id="bookBtn" onclick="saveBooking()">
      बुकिंग करें
    </button>

    <p class="small">
      किराया ₹12 प्रति किलोमीटर के उदाहरण पर है।
      वास्तविक किराया अलग हो सकता है।
    </p>

  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const map = L.map("map").setView([26.45, 74.64], 7);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    attribution: "&copy; OpenStreetMap contributors",
    maxZoom: 19
  }
).addTo(map);

let routeLayer = null;
let markers = [];

async function getLocation(place) {
  const url =
    "https://nominatim.openstreetmap.org/search?format=json&limit=1&q="
    + encodeURIComponent(place);

  const response = await fetch(url);

  if (!response.ok) {
    throw new Error("जगह खोजने की सेवा उपलब्ध नहीं है।");
  }

  const data = await response.json();

  if (!data.length) {
    throw new Error("जगह नहीं मिली: " + place);
  }

  return {
    lat: Number(data[0].lat),
    lon: Number(data[0].lon)
  };
}

async function calculateRide() {
  const pickup = document.getElementById("pickup").value.trim();
  const drop = document.getElementById("drop").value.trim();
  const result = document.getElementById("result");
  const button = document.getElementById("searchBtn");

  if (!pickup || !drop) {
    alert("कृपया दोनों जगह दर्ज करें।");
    return;
  }

  button.disabled = true;
  button.textContent = "रूट खोज रहे हैं...";

  try {
    const start = await getLocation(pickup);
    const end = await getLocation(drop);

    const routeUrl =
      "https://router.project-osrm.org/route/v1/driving/" +
      start.lon + "," + start.lat + ";" +
      end.lon + "," + end.lat +
      "?overview=full&geometries=geojson";

    const response = await fetch(routeUrl);
    const data = await response.json();

    if (data.code !== "Ok" || !data.routes.length) {
      throw new Error("सड़क का रास्ता नहीं मिला।");
    }

    const route = data.routes[0];
    const distance = route.distance / 1000;
    const duration = route.duration / 60;
    const fare = Math.ceil(distance * 12);

    if (routeLayer) map.removeLayer(routeLayer);
    markers.forEach(marker => map.removeLayer(marker));
    markers = [];

    routeLayer = L.geoJSON(route.geometry, {
      style: { color: "#1769ff", weight: 6 }
    }).addTo(map);

    markers.push(
      L.marker([start.lat, start.lon]).addTo(map).bindPopup(pickup),
      L.marker([end.lat, end.lon]).addTo(map).bindPopup(drop)
    );

    map.fitBounds(routeLayer.getBounds(), {
      padding: [25, 25]
    });

    result.innerHTML = "";

    [
      ["शुरुआत", pickup],
      ["मंजिल", drop],
      ["सड़क की दूरी", distance.toFixed(1) + " km"],
      ["अनुमानित समय", Math.round(duration) + " मिनट"],
      ["उदाहरण का किराया", "₹" + fare]
    ].forEach(([label, value]) => {
      const row = document.createElement("div");
      const strong = document.createElement("strong");
      strong.textContent = label + ": ";
      row.append(strong, document.createTextNode(value));
      result.appendChild(row);
    });

  } catch (error) {
    result.textContent = error.message;
  } finally {
    button.disabled = false;
    button.textContent = "🗺️ दूरी और किराया देखें";
  }
}
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

import {
  getAuth,
  signInAnonymously
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDKWUV2Qx_Jm7R_NVlLNcdUKLAWyZn3P6s",
  authDomain: "myridebhilwara-45652.firebaseapp.com",
  projectId: "myridebhilwara-45652",
  storageBucket: "myridebhilwara-45652.firebasestorage.app",
  messagingSenderId: "819961031572",
  appId: "1:819961031572:web:b7e1f401c90d7335203d81"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

window.saveBooking = async function() {
  const pickup = document.getElementById("pickup").value.trim();
  const drop = document.getElementById("drop").value.trim();
  const vehicle = document.getElementById("vehicleType").value;
  const button = document.getElementById("bookBtn");

  if (!pickup || !drop) {
    alert("कृपया शुरुआत और मंजिल भरें।");
    return;
  }

  button.disabled = true;
  button.textContent = "Booking सेव हो रही है...";

  try {
    if (!auth.currentUser) {
      await signInAnonymously(auth);
    }

    await addDoc(collection(db, "Booking"), {
      status: "Pending",
      vehicleType: vehicle,
      city: "Bhilwara",
      pickup: pickup,
      destination: drop,
      createdAt: serverTimestamp()
    });

    alert("आपकी Booking Firebase में सेव हो गई!");

  } catch (error) {
    console.error("Firebase Error:", error.code, error.message);
    alert("Booking Error: " + error.code + " - " + error.message);

  } finally {
    button.disabled = false;
    button.textContent = "बुकिंग करें";
  }
};
</script>
